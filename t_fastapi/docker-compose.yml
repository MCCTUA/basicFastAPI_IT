services:
  tfastapidb:
    image: postgres:17-alpine
    container_name: tfastapidb
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456 # ต้องตรงกับในไฟล์ .env ของคุณ
      - POSTGRES_DB=tfastDB # ชื่อฐานข้อมูลที่คุณตั้งไว้ใน .env
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
